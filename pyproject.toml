[project]
name = "dc-motor-sim"
version = "1.0.0"
description = "DC Motor PID Speed and Position Control Simulation"
authors = [
    { name = "Muhammed Mustafa Korkunç" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "control>=0.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["N803", "N806"] # Allow uppercase variables (common in math/control systems)
